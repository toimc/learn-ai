packages:
  - 'packages/*'

# pnpm 11 构建脚本白名单（postinstall/install 等）
allowBuilds:
  esbuild: true
  simple-git-hooks: true
  vue-demi: true

# Mastra 观测栈版本锁：@mastra/core 锚 1.60，loggers 1.3+/observability 1.17+
# 依赖 core 更新的导出（buildLogRecordData/resolveExportedSpanId），caret 重解析
# 会漂到不兼容版本（mastra CLI 树内的 loggers 已实际漂移过一次），全 workspace 锁死
overrides:
  '@mastra/loggers': 1.2.0
  '@mastra/observability': 1.16.6
  '@mastra/duckdb': 1.6.3
