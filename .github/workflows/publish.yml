name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string
      use_changeset:
        description: 'Use changeset mode'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: |
          pnpm test
          pnpm type-check

      - name: Publish to npm
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发
            if [ "${{ inputs.use_changeset }}" = "true" ]; then
              ./scripts/publish.sh --changeset
            else
              ./scripts/publish.sh --manual "${{ inputs.version }}"
            fi
          else
            # Git tag 触发，从 tag 提取版本号
            VERSION=${GITHUB_REF#refs/tags/v}
            ./scripts/publish.sh --manual "$VERSION" --tag "$VERSION"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_REGISTRY: https://registry.npmjs.org

      - name: Create GitHub Release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Changes in this Release

            See [CHANGELOG.md](https://github.com/your-org/ai-chat-ui/blob/master/CHANGELOG.md) for details.

            ## Published Packages

            - @ai-chat/core@${{ github.ref_name }}
            - @ai-chat/vue@${{ github.ref_name }}
            - @ai-chat/markdown@${{ github.ref_name }}
          draft: false
          prerelease: false