name: E2E Tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'packages/**'
      - 'e2e/**'
      - 'playground.config.ts'
      - 'package.json'
  pull_request:
    branches: [main, dev]
    paths:
      - 'packages/**'
      - 'e2e/**'
      - 'playground.config.ts'
      - 'package.json'

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.project }}

      - name: Build packages
        run: pnpm build

      - name: Run Playwright tests
        run: pnpm test:e2e --project=${{ matrix.project }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  e2e-tests-mobile:
    timeout-minutes: 45
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: [Mobile Chrome, Mobile Safari]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build packages
        run: pnpm build

      - name: Run Playwright mobile tests
        run: pnpm test:e2e --project="${{ matrix.project }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  e2e-report:
    runs-on: ubuntu-latest
    needs: [e2e-tests, e2e-tests-mobile]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: playwright-reports

      - name: Merge reports
        run: |
          pnpm exec playwright merge-reports --config=playwright.config.ts playwright-reports/*

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-merged-report
          path: playwright-report/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            fs = require('fs');
            const reportPath = 'playwright-report/index.html';
            if (fs.existsSync(reportPath)) {
              const body = '## 🎭 E2E测试报告\n\n测试已完成，请查看详细报告。\n\n';
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
